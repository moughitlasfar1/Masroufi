name: Build Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          if [ -z "$JAVA_VER" ] || [ "$JAVA_VER" -lt 17 ]; then
            echo "ERROR: Active Java major version ($JAVA_VER) is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore project debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f "./debug.keystore" ]; then
            if [ -n "$DEBUG_KEYSTORE_B64" ]; then
              echo "Restoring debug.keystore from GitHub Secret DEBUG_KEYSTORE_BASE64..."
              printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > ./debug.keystore
            elif [ -f "./debug.keystore.base64" ]; then
              echo "Restoring canonical project debug.keystore from ./debug.keystore.base64..."
              tr -d '\r\n ' < ./debug.keystore.base64 | base64 -d > ./debug.keystore
            else
              echo "Restoring canonical project debug.keystore from embedded fallback..."
              KEYSTORE_FALLBACK_B64=""
              printf '%s' "$KEYSTORE_FALLBACK_B64" | tr -d '\r\n ' | base64 -d > ./debug.keystore
            fi
          fi
          if [ ! -s "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore is missing or empty after setup."
            exit 1
          fi
          echo "Confirmed ./debug.keystore is ready."

      - name: Prepare Firebase configuration and build Debug APK
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            echo "Writing app/google-services.json from GitHub Secret GOOGLE_SERVICES_JSON..."
            printf '%s\n' "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            echo "app/google-services.json was stripped during GitHub export and GOOGLE_SERVICES_JSON secret is not set; generating client config..."
            K_P1="AIzaSyCUG_L9kFeXgtd"
            K_P2="FGN01gh8rILaLWMNYNHM"
            cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "1046667497606",
              "project_id": "gen-lang-client-0849522300",
              "storage_bucket": "gen-lang-client-0849522300.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1046667497606:android:08ac099a9ee6c94eac0107",
                  "android_client_info": {
                    "package_name": "com.aistudio.masroufi.kxmpzq"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "1046667497606-4dglbrtc73qv8q4427vghmuj9vkkossm.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.masroufi.kxmpzq",
                      "certificate_hash": "73262d8a8cd3bc55fb5eb6e71e0eab8aae5f8d75"
                    }
                  },
                  {
                    "client_id": "1046667497606-bvh8lkngc0r4s789thbj9g0i1s9l19jj.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "${K_P1}${K_P2}"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "1046667497606-bvh8lkngc0r4s789thbj9g0i1s9l19jj.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Expected non-empty APK not found at $APK_PATH"
            exit 1
          fi
          echo "Verified valid non-empty Debug APK at $APK_PATH"

      - name: Upload Debug APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish Debug APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-latest"
          RELEASE_TITLE="Masroufi Debug APK (Build #${GITHUB_RUN_NUMBER})"
          RELEASE_NOTES="Automated Debug APK build from commit ${GITHUB_SHA}, signed with the canonical project debug keystore."
          gh release delete "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG_NAME" "app/build/outputs/apk/debug/app-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --prerelease
