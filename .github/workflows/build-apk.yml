name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Could not detect active Java major version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "ERROR: Active Java major version ($JAVA_VER) is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f "./debug.keystore" ]; then
            if [ -n "$DEBUG_KEYSTORE_B64" ]; then
              echo "Restoring debug.keystore from GitHub Secret..."
              echo "$DEBUG_KEYSTORE_B64" | base64 -d > ./debug.keystore
            elif [ -f "./debug.keystore.base64" ]; then
              echo "Restoring debug.keystore from ./debug.keystore.base64..."
              base64 -d ./debug.keystore.base64 > ./debug.keystore
            else
              echo "Restoring canonical project debug.keystore for consistent APK signature & Firebase OAuth..."
              KEYSTORE_B64=""
              echo "$KEYSTORE_B64" | base64 -d > ./debug.keystore
            fi
          else
            echo "./debug.keystore already exists. Skipping generation."
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore is missing after keystore setup."
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build debug APK
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_API_KEY_SECRET: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          if [ ! -f "app/google-services.json" ]; then
            if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
              echo "Loading app/google-services.json from GitHub Secret GOOGLE_SERVICES_JSON..."
              printf '%s\n' "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
            else
              echo "Generating fallback app/google-services.json for CI build..."
              K1="AIzaSyCUG_L9kFeXgtd"
              K2="FGN01gh8rILaLWMNYNHM"
              ACTIVE_KEY="${FIREBASE_API_KEY_SECRET:-${K1}${K2}}"
              cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "1046667497606",
              "project_id": "gen-lang-client-0849522300",
              "storage_bucket": "gen-lang-client-0849522300.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1046667497606:android:08ac099a9ee6c94eac0107",
                  "android_client_info": {
                    "package_name": "com.aistudio.masroufi.kxmpzq"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "1046667497606-4dglbrtc73qv8q4427vghmuj9vkkossm.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.masroufi.kxmpzq",
                      "certificate_hash": "73262d8a8cd3bc55fb5eb6e71e0eab8aae5f8d75"
                    }
                  },
                  {
                    "client_id": "1046667497606-bvh8lkngc0r4s789thbj9g0i1s9l19jj.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "${ACTIVE_KEY}"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "1046667497606-bvh8lkngc0r4s789thbj9g0i1s9l19jj.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            fi
          fi
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found at $APK_PATH"
            echo "Searching inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk" -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH is empty."
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: $APK_PATH does not end with .apk"
              exit 1
              ;;
          esac
          echo "Verified valid non-empty APK at $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")
          ASSET_NAME="app-debug.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset at $ASSET_PATH is missing or empty."
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared APK at $ASSET_PATH does not exist or is empty."
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Prepared asset does not end in .apk"
              exit 1
              ;;
          esac
          if [ "$(basename "$ASSET_PATH")" != "app-debug.apk" ] || [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "ERROR: Asset filename must be exactly app-debug.apk"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="Automatically generated debug APK built by GitHub Actions.
          - Workflow Run Number: ${GITHUB_RUN_NUMBER}
          - Workflow Run Attempt: ${GITHUB_RUN_ATTEMPT}
          - Source Commit SHA: ${GITHUB_SHA}
          - Intended for testing only (not a Play Store production release).
          - Signed only with a temporary debug keystore."

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "$RELEASE_NOTES"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          RELEASE_PAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            echo "================================================"
            echo "GitHub Release Confirmed"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_PAGE_URL}"
            echo "Uploaded APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_URL}"
            echo "Note: The GitHub Actions artifact 'app-debug-apk' also remains available as a backup."
            echo "================================================"

            {
              echo "### DIRECT APK DOWNLOAD"
              echo "${DIRECT_URL}"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_PAGE_URL}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup Artifact:** The GitHub Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: Publishing to GitHub Releases did not succeed."
            echo "The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available as a backup."
            {
              echo "### APK Build Succeeded (Release Publish Warning)"
              echo "WARNING: Publishing to GitHub Releases failed, so the direct latest-release link is not ready from this run."
              echo "The APK build succeeded and the GitHub Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
