name: Build Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# SEC-01 & SEC-10: Least-privilege read-only permissions; never publish debug APKs to public Releases
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java environment
        run: |
          java -version
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          if [ -z "$JAVA_VER" ] || [ "$JAVA_VER" -lt 17 ]; then
            echo "ERROR: Active Java major version ($JAVA_VER) is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v4.3.1
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEFAULT_DEBUG_KEYSTORE_B64: ""
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "Restoring debug.keystore from GitHub Secret DEBUG_KEYSTORE_BASE64..."
            printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > ./debug.keystore || rm -f ./debug.keystore
          elif [ ! -f "./debug.keystore" ] && [ -f "./debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from ./debug.keystore.base64..."
            tr -d '\r\n ' < ./debug.keystore.base64 | base64 -d > ./debug.keystore || rm -f ./debug.keystore
          elif [ ! -f "./debug.keystore" ]; then
            echo "Restoring consistent project debug.keystore (SHA-1: 73:26:2D:8A:...)..."
            printf '%s' "$DEFAULT_DEBUG_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > ./debug.keystore || rm -f ./debug.keystore
          fi
          if ! keytool -list -keystore ./debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo "Generating fallback CI debug.keystore..."
            rm -f ./debug.keystore
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -s "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore is missing or empty after setup."
            exit 1
          fi

      - name: Prepare Firebase configuration and build Debug APK
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$SDK_DIR" ]; then
            mkdir -p "$SDK_DIR/licenses"
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" >> "$SDK_DIR/licenses/android-sdk-license"
            if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
              yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            fi
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            FIRST_CHAR=$(printf '%s' "$GOOGLE_SERVICES_JSON_SECRET" | tr -d '\r\n\t ' | cut -c1)
            if [ "$FIRST_CHAR" = "{" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json.tmp
            else
              printf '%s' "$GOOGLE_SERVICES_JSON_SECRET" | tr -d '\r\n ' | base64 -d > app/google-services.json.tmp 2>/dev/null || true
            fi
            if grep -q '"project_info"' app/google-services.json.tmp 2>/dev/null && grep -q '"com.aistudio.masroufi.kxmpzq"' app/google-services.json.tmp 2>/dev/null; then
              mv app/google-services.json.tmp app/google-services.json
              echo "Loaded valid app/google-services.json from GitHub Secret GOOGLE_SERVICES_JSON."
            else
              rm -f app/google-services.json.tmp
              echo "NOTICE: GOOGLE_SERVICES_JSON secret did not match package com.aistudio.masroufi.kxmpzq; keeping repository app/google-services.json."
            fi
          fi
          if [ -f "app/google-services.json" ] && ! grep -q '"project_info"' app/google-services.json 2>/dev/null; then
            echo "NOTICE: Removing malformed app/google-services.json so MissingGoogleServicesStrategy.WARN applies."
            rm -f app/google-services.json
          fi
          if [ ! -f "app/google-services.json" ]; then
            echo "Generating fallback default_web_client_id resource for GitHub Actions build..."
            cat << 'EOF' > app/src/main/res/values/google_services_ci.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_web_client_id" translatable="false">1046667497606-bvh8lkngc0r4s789thbj9g0i1s9l19jj.apps.googleusercontent.com</string>
              <string name="gcm_defaultSenderId" translatable="false">1046667497606</string>
              <string name="google_storage_bucket" translatable="false">gen-lang-client-0849522300.firebasestorage.app</string>
              <string name="project_id" translatable="false">gen-lang-client-0849522300</string>
              <string name="google_app_id" translatable="false">1:1046667497606:android:08ac099a9ee6c94eac0107</string>
          </resources>
          EOF
            sed -i 's/^          //' app/src/main/res/values/google_services_ci.xml
          fi
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Expected non-empty APK not found at $APK_PATH"
            exit 1
          fi
          echo "Verified valid non-empty Debug APK at $APK_PATH"

      - name: Upload Debug APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-build-${{ github.run_number }}-${{ github.run_attempt }}"
          SHORT_SHA=$(printf '%s' "${{ github.sha }}" | cut -c1-7)
          gh release create "$TAG_NAME" "app/build/outputs/apk/debug/app-debug.apk#masroufi-debug-build-${{ github.run_number }}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Masroufi Debug APK (Build #${{ github.run_number }})" \
            --latest \
            --notes "Automatically generated Masroufi APK built by GitHub Actions.

          - Workflow Run Number: ${{ github.run_number }}
          - Workflow Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${SHORT_SHA}"

