name: Production Release (Signed AAB & APK)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# SEC-10: Default read-only workflow permissions; elevate only on the release job
permissions:
  contents: read

jobs:
  release-production:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v4.3.1
        with:
          gradle-version: '9.3.1'

      # SEC-01: Restore debug keystore from secret (or generate ephemeral local keystore for Gradle config evaluation)
      - name: Prepare debug keystore for Gradle signingConfigs evaluation
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f "./debug.keystore" ]; then
            if [ -n "$DEBUG_KEYSTORE_B64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > ./debug.keystore
            else
              keytool -genkeypair -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Decode Production Upload Keystore from GitHub Secrets
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Missing production signing secrets (RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD)."
            echo "Configure these in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > ./my-upload-key.jks
          if [ ! -s "./my-upload-key.jks" ]; then
            echo "ERROR: Decoded ./my-upload-key.jks is empty."
            exit 1
          fi

      - name: Build Signed Production AAB and APK (R8 Minified & Obfuscated)
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
          fi
          gradle :app:bundleRelease :app:assembleRelease --stacktrace --no-daemon

      - name: Upload Signed Production AAB (Google Play)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: masroufi-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload Signed Production APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: masroufi-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish Signed Production Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG_NAME" \
            app/build/outputs/bundle/release/*.aab \
            app/build/outputs/apk/release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Masroufi ${TAG_NAME}" \
            --latest \
            --generate-notes
