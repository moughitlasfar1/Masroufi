name: Production Release (Signed AAB & APK)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v1.5.0). Leave blank to build artifacts only.'
        required: false
        default: 'v1.5.0'
        type: string

# S11: Default read-only workflow permissions; require manual approval via production environment
permissions:
  contents: read

jobs:
  release-production:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v4.3.1
        with:
          gradle-version: '9.3.1'

      - name: Decode Production Upload Keystore from GitHub Secrets
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Missing production signing secrets (RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD)."
            echo "Configure these in GitHub Repository Settings -> Environments -> production -> Secrets."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > ./my-upload-key.jks
          if [ ! -s "./my-upload-key.jks" ]; then
            echo "ERROR: Decoded ./my-upload-key.jks is empty."
            exit 1
          fi

      - name: Build Signed Production AAB and APK (R8 Minified & Obfuscated)
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$SDK_DIR" ]; then
            mkdir -p "$SDK_DIR/licenses"
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" >> "$SDK_DIR/licenses/android-sdk-license"
            if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
              yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            fi
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            FIRST_CHAR=$(printf '%s' "$GOOGLE_SERVICES_JSON_SECRET" | tr -d '\r\n\t ' | cut -c1)
            if [ "$FIRST_CHAR" = "{" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json.tmp
            else
              printf '%s' "$GOOGLE_SERVICES_JSON_SECRET" | tr -d '\r\n ' | base64 -d > app/google-services.json.tmp 2>/dev/null || true
            fi
            if grep -q '"project_info"' app/google-services.json.tmp 2>/dev/null && grep -q '"com.masroufi.app"' app/google-services.json.tmp 2>/dev/null; then
              mv app/google-services.json.tmp app/google-services.json
              echo "Loaded valid app/google-services.json from GitHub Secret GOOGLE_SERVICES_JSON."
            else
              rm -f app/google-services.json.tmp
              echo "NOTICE: GOOGLE_SERVICES_JSON secret did not match package com.masroufi.app; keeping repository app/google-services.json."
            fi
          fi
          gradle :app:bundleRelease :app:assembleRelease --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Upload Signed Production AAB (Private Artifact Only — Google Play)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: masroufi-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload Signed Production APK (Private Artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: masroufi-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish Signed Production Release (APK & AAB)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="$INPUT_TAG"
          fi
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Invalid release tag '$TAG_NAME'. Expected format vX.Y.Z (e.g. v1.5.0)."
            exit 1
          fi
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists — updating signed APK & AAB assets (--clobber)."
            gh release upload "$TAG_NAME" \
              app/build/outputs/apk/release/*.apk \
              app/build/outputs/bundle/release/*.aab \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG_NAME" \
              app/build/outputs/apk/release/*.apk \
              app/build/outputs/bundle/release/*.aab \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Masroufi ${TAG_NAME}" \
              --latest \
              --generate-notes
          fi
