name: Production Release (Signed AAB & APK)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# S11: Default read-only workflow permissions; require manual approval via production environment
permissions:
  contents: read

jobs:
  release-production:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v4.3.1
        with:
          gradle-version: '9.3.1'

      - name: Decode Production Upload Keystore from GitHub Secrets
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Missing production signing secrets (RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD)."
            echo "Configure these in GitHub Repository Settings -> Environments -> production -> Secrets."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > ./my-upload-key.jks
          if [ ! -s "./my-upload-key.jks" ]; then
            echo "ERROR: Decoded ./my-upload-key.jks is empty."
            exit 1
          fi

      - name: Build Signed Production AAB and APK (R8 Minified & Obfuscated)
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$SDK_DIR" ]; then
            mkdir -p "$SDK_DIR/licenses"
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" >> "$SDK_DIR/licenses/android-sdk-license"
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
          fi
          gradle :app:bundleRelease :app:assembleRelease --stacktrace --no-daemon

      - name: Upload Signed Production AAB (Private Artifact Only — Google Play)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: masroufi-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload Signed Production APK (Private Artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: masroufi-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish Signed Production APK Release on Tag (AAB Excluded)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG_NAME" \
            app/build/outputs/apk/release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Masroufi ${TAG_NAME}" \
            --latest \
            --generate-notes
