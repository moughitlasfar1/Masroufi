version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Keep Gradle registered for GitHub Dependabot security advisories/updates,
  # while disabling routine version-bump PRs (open-pull-requests-limit: 0) that
  # break the pinned AGP 9.1.1 + Kotlin 2.2.10 + Compose compatibility matrix.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
